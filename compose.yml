services:
  # MySQL データベース
  mysql:
    image: mysql:8.0
    container_name: rap_bot_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rap_bot}
      MYSQL_USER: ${MYSQL_USER:-your_db_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-your_db_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rap_bot_network
    restart: unless-stopped

  # Next.js アプリケーション
  app:
    build: .
    container_name: rap_bot_app
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-your_db_user}:${MYSQL_PASSWORD:-your_db_password}@mysql:3306/${MYSQL_DATABASE:-rap_bot}
      NODE_ENV: development
      # 環境変数はオプション（.envから読み込み）
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - rap_bot_network
    restart: unless-stopped
    command: npm run dev

  # VOICEVOX音声合成エンジン
  voicevox:
    image: voicevox/voicevox_engine:latest
    container_name: rap_bot_voicevox
    ports:
      - "50021:50021"
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - rap_bot_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  rap_bot_network:
    driver: bridge
